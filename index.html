<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kumu network with repeats</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
:root{--paper:#F6F7F6;--surface:#FFFFFF;--ink:#1B2421;--muted:#5E6B66;--line:#D9DEDB;--soft:#EEF1EF;--danger:#A32D2D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121615;--surface:#1A201E;--ink:#E8EDEA;--muted:#9AA6A1;--line:#2C3431;--soft:#202725;--danger:#F09595}}
:root[data-theme="dark"]{--paper:#121615;--surface:#1A201E;--ink:#E8EDEA;--muted:#9AA6A1;--line:#2C3431;--soft:#202725;--danger:#F09595}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 64px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:8px}
.bar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
input,textarea,button{font:inherit;color:inherit}
input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=text]:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{background:var(--soft)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary:hover{opacity:.88}
.status{font-size:13px;color:var(--muted)}
.chart{margin:0 auto;aspect-ratio:16/9;background:#000000;border-radius:12px;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
h2{font-size:17px;font-weight:600;margin:36px 0 4px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;max-width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px;border-bottom:1px solid var(--soft)}
td input[type=text]{width:100%;border-color:transparent;background:transparent}
td input[type=text]:hover{border-color:var(--line)}
td.x{width:36px;text-align:center}
td.x button{border:none;background:none;color:var(--muted);padding:4px 8px}
td.x button:hover{color:var(--danger)}
.row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
details{margin-top:20px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pimg{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.pname{font-size:14px;font-weight:500}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pbtns button{padding:4px 10px;font-size:13px}
summary{cursor:pointer;font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:140px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.err{color:var(--danger);font-size:13px;min-height:1em;margin-top:6px}
</style></head><body><div id="root"></div>

<h2>Data</h2><p class="hint">Edit any cell and the network updates as you type. When a kumu connects to the same place more than once, those rows share one branch. The line gets thicker and the place shows a count, like ×2.</p>
<div class="tablewrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="row-actions"><button id="add">Add row</button></div>
<details><summary>Paste data from a spreadsheet</summary>
<textarea id="paste" placeholder="Kumu Name&#9;Wahi&#9;Number Visits&#9;Ahupuaʻa&#9;Label&#9;Moku"></textarea>
<div class="row-actions"><button id="replace">Replace all rows</button><button id="append">Add to existing rows</button></div>
<div class="err" id="perr"></div></details>
<h2>Kumu photos</h2><p class="hint">Add a photo for a kumu and it appears when you hover over their name in the network.</p>
<div class="photos" id="photos"></div><input type="file" id="pfile" accept="image/*" hidden><div class="err" id="phErr"></div></div>`;

const $=id=>document.getElementById(id);
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

function setStatus(t){$('status').textContent=t;}
function markDirty(){dirty=true;setStatus(readOnly?'Changes are only in this view':'Unsaved changes');}

let rt=null;function scheduleChart(){clearTimeout(rt);rt=setTimeout(()=>{drawChart();drawPhotos();},120);}
let photoFor=null;
function kumuNames(){return [...new Set(state.rows.map(r=>(r.kumu||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
function drawPhotos(){const box=$('photos');box.innerHTML='';
  kumuNames().forEach(name=>{const c=document.createElement('div');c.className='pcard';const url=state.photos[name];
    let im;if(url){im=document.createElement('img');im.src=url;im.alt=name;}else{im=document.createElement('div');im.textContent='No photo';}im.className='pimg';
    const nm=document.createElement('div');nm.className='pname';nm.textContent=name;
    const bs=document.createElement('div');bs.className='pbtns';const add=document.createElement('button');add.textContent=url?'Replace':'Add photo';
    add.addEventListener('click',()=>{photoFor=name;$('phErr').textContent='';$('pfile').value='';$('pfile').click();});bs.appendChild(add);
    if(url){const rm=document.createElement('button');rm.textContent='Remove';rm.addEventListener('click',()=>{delete state.photos[name];markDirty();drawPhotos();drawChart();});bs.appendChild(rm);}
    c.append(im,nm,bs);box.appendChild(c);});}
function loadPhoto(file){return new Promise((res,rej)=>{if(!file||!file.type.startsWith('image/'))return rej(new Error('Choose an image file.'));
  const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const S=320,sz=Math.min(img.width,img.height),cv=document.createElement('canvas');cv.width=cv.height=S;
    cv.getContext('2d').drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,S,S);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',0.82));};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That image could not be read. Try a JPG or PNG.'));};img.src=u;});}

function buildTree(){
  const root={name:state.center||'Me',depth:0,kids:[],parent:null};
  const find=(p,name,depth,moku)=>{let n=p.kids.find(k=>k.name===name);if(!n){n={name,depth,kids:[],parent:p,moku,count:0};p.kids.push(n);}n.count++;return n;};
  const mokuIdx={};
  state.rows.forEach(r=>{
    const k=(r.kumu||'').trim();if(!k)return;
    const m=(r.moku||'').trim()||'(no moku)',a=(r.ahupuaa||'').trim()||'(no ahupuaʻa)',w=(r.wahi||'').trim()||'(no wahi)';
    if(!(m in mokuIdx))mokuIdx[m]=Object.keys(mokuIdx).length;
    const n1=find(root,m,1,m),n2=find(n1,a,2,m),n3=find(n2,w,3,m);find(n3,k,4,m);
  });
  return {root,mokuIdx};
}

function drawChart(){
  const {root,mokuIdx}=buildTree();
  const box=$('chart');box.innerHTML='';
  const svg=mk('svg',{viewBox:'0 0 1200 675',role:'img','aria-label':'Radial network of kumu by moku, ahupuaʻa, and wahi'},box);
  const L=mk('g',{},svg),N=mk('g',{},svg),TIP=mk('g',{style:'pointer-events:none;opacity:0;transition:opacity .12s'},svg);
  const all=[];let leaves=[];
  (function walk(n){all.push(n);if(!n.kids.length&&n.depth===4)leaves.push(n);n.kids.forEach(walk);})(root);
  const cx=600,cy=338,SX=1.55,R=[0,86,148,204,250],SZ=[0,11,9,7.5,6.5],NL=Math.max(leaves.length,1),step=360/NL,off=-180-step/2;
  leaves.forEach((n,i)=>n.a=(i+0.5)*step+off);
  (function ang(n){if(n.depth===4)return n.a;if(!n.kids.length){n.a=0;return 0;}n.a=n.kids.map(ang).reduce((s,v)=>s+v,0)/n.kids.length;return n.a;})(root);
  const pt=(r,a)=>{const t=a*Math.PI/180;return[cx+SX*r*Math.sin(t),cy-r*Math.cos(t)];};
  const col=n=>PAL[(mokuIdx[n.moku]||0)%PAL.length];
  const tint=(h,k)=>{const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));return'#'+v.map(c=>Math.round(c+(255-c)*k).toString(16).padStart(2,'0')).join('');};
  if(!leaves.length){const t=mk('text',{x:cx,y:cy,'text-anchor':'middle','dominant-baseline':'central',fill:'#A9B1AD','font-size':20},svg);t.textContent='Add a row with a kumu name to start the network';return;}
  all.forEach(n=>{if(!n.parent)return;const d=n.depth,[x0,y0]=pt(R[d-1],n.parent.a),[x1,y1]=pt(R[d],n.a);let p;
    if(d===1)p=`M${x0} ${y0}L${x1} ${y1}`;else{const rm=(R[d-1]+R[d])/2,[ax,ay]=pt(rm,n.parent.a),[bx,by]=pt(rm,n.a);p=`M${x0} ${y0}C${ax} ${ay} ${bx} ${by} ${x1} ${y1}`;}
    n.link=mk('path',{d:p,fill:'none',stroke:col(n),'stroke-width':Math.min((n.depth>=2?1.6:2.2)+(n.count-1)*1.2,5.5),'stroke-linecap':'round',opacity:.55},L);});
  let tipG=null;
  const CARD=mk('g',{style:'pointer-events:none'},svg);CARD.remove();
  const showCard=(n)=>{const url=state.photos[n.name];TIP.style.opacity=0;if(tipG)tipG.remove();tipG=mk('g',{},TIP);
    const [px,py]=pt(165,n.a),W=url?190:0,ty=0;
    if(url){let x=Math.max(10,Math.min(1190-W,px-W/2)),y=Math.max(10,Math.min(665-236,py-118));
      mk('rect',{x,y,width:W,height:236,rx:12,fill:'#000000',stroke:col(n),'stroke-width':1.5},tipG);
      const cid='clip'+Math.random().toString(36).slice(2);const cp=mk('clipPath',{id:cid},tipG);mk('rect',{x:x+15,y:y+15,width:160,height:160,rx:10},cp);
      mk('image',{href:url,x:x+15,y:y+15,width:160,height:160,'clip-path':`url(#${cid})`,preserveAspectRatio:'xMidYMid slice'},tipG);
      const t=mk('text',{x:x+W/2,y:y+205,'text-anchor':'middle','dominant-baseline':'central',fill:tint(col(n),.3),'font-size':18,'font-weight':600},tipG);t.textContent=n.name;
      if(t.getComputedTextLength()>W-20)t.setAttribute('font-size',15);TIP.style.opacity=1;}};
  const showTip=(n,x,y)=>{if(tipG)tipG.remove();tipG=mk('g',{},TIP);const r=mk('rect',{rx:8,height:34,fill:'#000000',stroke:col(n),'stroke-width':1},tipG);
    const ty=y-SZ[n.depth]-24;const t=mk('text',{x,y:ty,'text-anchor':'middle','dominant-baseline':'central',fill:'#FFFFFF','font-size':18,'font-weight':500},tipG);t.textContent=n.name;
    const w=t.getComputedTextLength()+24;r.setAttribute('x',x-w/2);r.setAttribute('y',ty-17);r.setAttribute('width',w);TIP.style.opacity=1;};
  const small=NL>24?13:16,big=NL>24?16:20;
  all.forEach(n=>{const [x,y]=pt(R[n.depth],n.a);const g=mk('g',{style:'transition:opacity .15s'},N);n.el=g;
    if(n.depth===0){const c=mk('circle',{cx,cy,r:34,fill:'#000000'},g);
      const t=mk('text',{x:cx,y:cy,'text-anchor':'middle','dominant-baseline':'central',fill:'#FFFFFF','font-size':22,'font-weight':600},g);t.textContent=n.name;
      const rr=Math.min(Math.max(38,t.getComputedTextLength()/2+14),70);c.setAttribute('r',rr);}
    else if(n.depth<4){mk('circle',{cx:x,cy:y,r:SZ[n.depth],fill:col(n),stroke:'#000000','stroke-width':1},g);mk('circle',{cx:x,cy:y,r:14,fill:'transparent'},g);
      g.addEventListener('mouseenter',()=>showTip(n,x,y));g.addEventListener('mouseleave',()=>{TIP.style.opacity=0;});}
    else{mk('circle',{cx:x,cy:y,r:Math.min(SZ[4]+(n.count-1)*1.5,10),fill:col(n),stroke:'#000000','stroke-width':1},g);
      const s=Math.sin(n.a*Math.PI/180),co=Math.cos(n.a*Math.PI/180),[lx,ly]=pt(266,n.a);
      let anc='middle',y1=ly-10,y2=ly+11;if(s>.35)anc='start';else if(s<-.35)anc='end';else if(co>0){y1=ly-30;y2=ly-9;}else{y1=ly+10;y2=ly+31;}
      const parts=n.name.split(/\s+/),HON=['kumu','uncle','aunty','auntie','kahu','kupuna','tutu','dr.'];
      if(parts.length>1&&HON.includes(parts[0].toLowerCase())){const a=mk('text',{x:lx,y:y1,'text-anchor':anc,'dominant-baseline':'central',fill:tint(col(n),.3),opacity:.75,'font-size':small},g);a.textContent=parts[0];
        const b=mk('text',{x:lx,y:y2,'text-anchor':anc,'dominant-baseline':'central',fill:tint(col(n),.3),'font-size':big,'font-weight':600},g);b.textContent=parts.slice(1).join(' ');}
      else if(parts.length>1){let best=1,bd=1e9;for(let i=1;i<parts.length;i++){const d=Math.abs(parts.slice(0,i).join(' ').length-parts.slice(i).join(' ').length);if(d<bd){bd=d;best=i;}}
        [[parts.slice(0,best).join(' '),y1],[parts.slice(best).join(' '),y2]].forEach(([tx,yy])=>{const b=mk('text',{x:lx,y:yy,'text-anchor':anc,'dominant-baseline':'central',fill:tint(col(n),.3),'font-size':small+1,'font-weight':600},g);b.textContent=tx;});}
      else{const b=mk('text',{x:lx,y:(y1+y2)/2,'text-anchor':anc,'dominant-baseline':'central',fill:tint(col(n),.3),'font-size':big,'font-weight':600},g);b.textContent=n.name;}}
    if(n.depth===4&&n.count>1){const lt=g.querySelectorAll('text'),last=lt[lt.length-1],ts=document.createElementNS(NS,'tspan');ts.setAttribute('fill','#A9B1AD');ts.setAttribute('font-weight','400');ts.setAttribute('font-size',small);ts.textContent=' ×'+n.count;last.appendChild(ts);}
    if(n.depth===4){g.style.cursor='default';g.addEventListener('mouseenter',()=>showCard(n));g.addEventListener('mouseleave',()=>{TIP.style.opacity=0;});}
    g.addEventListener('mouseenter',()=>hi(n));g.addEventListener('mouseleave',reset);});
  function hi(n){const s=new Set();let a=n;while(a){s.add(a);a=a.parent;}(function d(k){s.add(k);k.kids.forEach(d);})(n);
    all.forEach(m=>{m.el.style.opacity=s.has(m)?1:.25;if(m.link)m.link.setAttribute('opacity',s.has(m)&&m!==root?.95:.1);});}
  function reset(){all.forEach(m=>{m.el.style.opacity=1;if(m.link)m.link.setAttribute('opacity',.55);});}
}

function drawTable(){setTimeout(drawPhotos,0);
  $('thead').innerHTML=COLS.map(c=>`<th scope="col">${c[1]}</th>`).join('')+'<th><span class="sr-only" style="position:absolute;left:-9999px">Remove</span></th>';
  const tb=$('tbody');tb.innerHTML='';
  state.rows.forEach((r,i)=>{const tr=document.createElement('tr');
    COLS.forEach(([k,lab])=>{const td=document.createElement('td');const inp=document.createElement('input');inp.type='text';inp.value=r[k]||'';inp.setAttribute('aria-label',lab+' row '+(i+1));
      inp.addEventListener('input',()=>{r[k]=inp.value;markDirty();scheduleChart();});td.appendChild(inp);tr.appendChild(td);});
    const td=document.createElement('td');td.className='x';const b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','Remove row '+(i+1));
    b.addEventListener('click',()=>{state.rows.splice(i,1);markDirty();drawTable();drawChart();});td.appendChild(b);tr.appendChild(td);tb.appendChild(tr);});
}

const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f\u02bb\u2018\u2019']/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const HEAD={'kumu name':'kumu','kumu':'kumu','wahi':'wahi','number visits':'visits','visits':'visits','ahupuaa':'ahupuaa','label':'label','moku':'moku'};
function parsePaste(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)throw new Error('Paste at least one row first.');
  const sep=lines[0].includes('\t')?'\t':',';const cells=l=>l.split(sep).map(c=>c.trim());
  let keys=COLS.map(c=>c[0]),start=0;const first=cells(lines[0]).map(norm);
  if(first.some(c=>c==='moku')||first.some(c=>c==='kumu name')){keys=first.map(c=>HEAD[c]||null);start=1;
    if(!keys.includes('kumu'))throw new Error('The header row needs a Kumu Name column.');}
  return lines.slice(start).map(l=>{const c=cells(l),o={};COLS.forEach(([k])=>o[k]='');keys.forEach((k,i)=>{if(k)o[k]=c[i]||'';});return o;}).filter(o=>o.kumu);
}
function doPaste(replace){const e=$('perr');e.textContent='';
  try{const rows=parsePaste($('paste').value);if(!rows.length)throw new Error('No rows with a kumu name were found.');
    state.rows=replace?rows:state.rows.concat(rows);$('paste').value='';markDirty();drawTable();drawChart();}
  catch(err){e.textContent=err.message;}}
$('paste').addEventListener('input',()=>{$('perr').textContent='';});
$('replace').addEventListener('click',()=>doPaste(true));
$('append').addEventListener('click',()=>doPaste(false));
$('add').addEventListener('click',()=>{const o={};COLS.forEach(([k])=>o[k]='');state.rows.push(o);markDirty();drawTable();const ins=$('tbody').querySelectorAll('tr:last-child input');if(ins[0])ins[0].focus();});
$('center').value=state.center||'Me';
$('center').addEventListener('input',e=>{state.center=e.target.value;markDirty();scheduleChart();});

function buildHtml(){
  const css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
  const keep=new Set(kumuNames()),ph={};Object.keys(state.photos).forEach(k=>{if(keep.has(k))ph[k]=state.photos[k];});
  const json=JSON.stringify({center:state.center,photos:ph,rows:state.rows.filter(r=>COLS.some(([k])=>(r[k]||'').trim()))}).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kumu network with repeats</title>'+
  '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
  '<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">'+
  '<style id="css">'+css+'<\/style></head><body><div id="root"></div>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="app">'+app+'<\/script></body></html>';
}

$('save').addEventListener('click',async()=>{
  const art=await artP;
  if(!art){readOnly=true;setStatus('Saving is not available in this view');return;}
  $('save').disabled=true;setStatus('Saving…');
  const was=dirty;dirty=false;
  try{await art.publish(buildHtml());setStatus('Saved');}
  catch(e){dirty=was;const c=e&&e.code;
    if(c==='conflict')setStatus('A newer version was saved elsewhere. Reloading it.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'){readOnly=true;$('save').style.display='none';setStatus('This view is read-only');}
    else if(c==='rate_limited')setStatus('Saving too often. Wait a moment, then save again.');
    else if(c==='too_large')setStatus('The data is too large to save.');
    else setStatus('Could not save. Try again.');}
  finally{$('save').disabled=false;}
});
window.addEventListener('beforeunload',e=>{if(dirty&&!readOnly){e.preventDefault();e.returnValue='';}});

$('pfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!photoFor)return;try{state.photos[photoFor]=await loadPhoto(f);markDirty();drawPhotos();drawChart();}catch(err){$('phErr').textContent=err.message;}});
drawTable();drawChart();drawPhotos();setStatus('All changes saved');
})();
</script></body></html>
